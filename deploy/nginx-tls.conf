# Nobar King Akbar Anime — nginx host sebagai terminator TLS (opsional, untuk HTTPS)
#
# Pakai ini HANYA bila gateway container dipublikasikan di port lokal, mis.
#   GATEWAY_PORT=8080   (di .env)
# lalu nginx host meneruskan trafik 443 → 127.0.0.1:8080.
#
# Langkah:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-tls.conf /etc/nginx/sites-available/nobar-king
#   sudo sed -i 's/nobar.domainmu.com/DOMAIN_ASLI/g' /etc/nginx/sites-available/nobar-king
#   sudo ln -s /etc/nginx/sites-available/nobar-king /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN_ASLI      # menerbitkan sertifikat + mengubah conf ini
upstream nobar_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name nobar.domainmu.com;

    # certbot akan menambahkan blok HTTPS + redirect otomatis di sini.
    location / {
        proxy_pass http://nobar_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://nobar_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /socket.io/ {
        proxy_pass http://nobar_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
